<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육 프로그램 만족도 조사</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .radio-card:checked + label { border-color: #1a73e8; background-color: #f8fbff; }
    .radio-card:checked + label .dot-inner { display: block; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <header class="fixed top-0 left-0 w-full h-16 bg-white border-b border-slate-200 flex items-center justify-center px-4 z-50">
    <h1 class="text-lg font-bold text-slate-800">만족도 조사</h1>
  </header>

  <main class="flex-grow pt-20 pb-8 px-4 max-w-md mx-auto w-full">
    <div id="formSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">교육 프로그램 만족도 조사</h2>
        <p class="text-slate-500 text-sm">교육에 대한 여러분의 의견을 알려주세요.</p>
      </div>

      <form id="surveyForm" class="space-y-8">
        <div class="space-y-3">
          <label class="block text-base font-bold text-slate-800" for="name">1. 이름</label>
          <input class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder:text-slate-400" id="name" name="name" placeholder="이름을 입력해주세요." required type="text">
        </div>

        <div class="space-y-3">
          <label class="block text-base font-bold text-slate-800">2. 이번 교육에 얼마나 만족하셨나요?</label>
          <div class="space-y-3">
            <div class="relative">
              <input class="hidden radio-card" id="veryGood" name="satisfaction" required type="radio" value="매우 만족">
              <label class="flex items-center p-4 rounded-xl border border-slate-200 cursor-pointer transition-all hover:bg-slate-50" for="veryGood">
                <span class="w-5 h-5 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 flex items-center justify-center"><span class="dot-inner w-2.5 h-2.5 rounded-full bg-blue-600 hidden"></span></span>
                <span class="text-slate-700">매우 만족</span>
              </label>
            </div>
            <div class="relative">
              <input class="hidden radio-card" id="good" name="satisfaction" type="radio" value="만족">
              <label class="flex items-center p-4 rounded-xl border border-slate-200 cursor-pointer transition-all hover:bg-slate-50" for="good">
                <span class="w-5 h-5 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 flex items-center justify-center"><span class="dot-inner w-2.5 h-2.5 rounded-full bg-blue-600 hidden"></span></span>
                <span class="text-slate-700">만족</span>
              </label>
            </div>
            <div class="relative">
              <input class="hidden radio-card" id="normal" name="satisfaction" type="radio" value="보통">
              <label class="flex items-center p-4 rounded-xl border border-slate-200 cursor-pointer transition-all hover:bg-slate-50" for="normal">
                <span class="w-5 h-5 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 flex items-center justify-center"><span class="dot-inner w-2.5 h-2.5 rounded-full bg-blue-600 hidden"></span></span>
                <span class="text-slate-700">보통</span>
              </label>
            </div>
            <div class="relative">
              <input class="hidden radio-card" id="bad" name="satisfaction" type="radio" value="불만족">
              <label class="flex items-center p-4 rounded-xl border border-slate-200 cursor-pointer transition-all hover:bg-slate-50" for="bad">
                <span class="w-5 h-5 rounded-full border-2 border-slate-300 mr-3 flex-shrink-0 flex items-center justify-center"><span class="dot-inner w-2.5 h-2.5 rounded-full bg-blue-600 hidden"></span></span>
                <span class="text-slate-700">불만족</span>
              </label>
            </div>
          </div>
        </div>

        <div class="space-y-3">
          <label class="block text-base font-bold text-slate-800" for="helpful">3. 가장 유익했던 내용은 무엇인가요?</label>
          <textarea class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent min-h-[120px] placeholder:text-slate-400" id="helpful" name="helpful" placeholder="자유롭게 작성해주세요." required></textarea>
        </div>

        <div class="space-y-3">
          <label class="block text-base font-bold text-slate-800" for="opinion">4. 교육에 대한 추가 의견이 있다면 작성해주세요.</label>
          <textarea class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent min-h-[120px] placeholder:text-slate-400" id="opinion" name="opinion" placeholder="자유롭게 작성해주세요."></textarea>
        </div>

        <button id="submitButton" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-md active:scale-[0.98] disabled:bg-slate-300">제출하기</button>
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg text-center font-medium"></div>
      </form>
    </div>

    <div id="successSection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
      <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 24 24" width="40" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-3">제출 완료!</h2>
      <p class="text-slate-500">소중한 의견을 보내주셔서 감사합니다.<br>더 나은 교육 프로그램으로 보답하겠습니다.</p>
    </div>
  </main>

  <script>
    const form = document.getElementById('surveyForm');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const satisfaction = document.querySelector('input[name="satisfaction"]:checked');
      const helpful = document.getElementById('helpful').value.trim();
      const opinion = document.getElementById('opinion').value.trim();

      errorMessage.classList.add('hidden');

      if (!name) return showError('이름을 입력해주세요.');
      if (!satisfaction) return showError('교육 만족도를 선택해주세요.');
      if (!helpful) return showError('가장 유익했던 내용을 입력해주세요.');

      submitButton.disabled = true;
      submitButton.textContent = '제출 중...';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            submitButton.disabled = false;
            submitButton.textContent = '제출하기';
            showError(result.message || '오류가 발생했습니다.');
          }
        })
        .withFailureHandler(function(error) {
          submitButton.disabled = false;
          submitButton.textContent = '제출하기';
          showError(error.message || '잠시 후 다시 시도해주세요.');
        })
        .submitSurvey(name, satisfaction.value, helpful, opinion);
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }
  </script>
</body>
</html>
