<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 원소 운세 - Element Fortune</title>

  <!-- Pretendard 폰트 & FontAwesome 아이콘 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1e293b;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(199, 210, 254, 0.75) 0%, rgba(243, 232, 255, 0.45) 30%, rgba(254, 242, 242, 0.1) 60%),
        linear-gradient(135deg, #f0f7ff 0%, #f5f3ff 50%, #fef2f2 100%);
      background-attachment: fixed;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      height: 72px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      z-index: 100;
    }

    .header-logo a {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header-logo img {
      height: 38px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: 800;
      font-size: 1.2rem;
      color: #4f46e5;
      display: none;
    }

    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 메인 콘텐츠 */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .hero-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 0.98rem;
      color: #64748b;
    }

    /* 카드 입력 폼 */
    .card-form {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.08),
                  0 0 0 1px rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    /* 성별 선택 버튼 */
    .gender-group {
      display: flex;
      gap: 12px;
    }

    .gender-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .gender-btn.active {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    /* 5가지 원소 선택 버튼 */
    .element-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .element-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 6px;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .element-btn i {
      font-size: 1.4rem;
    }

    /* 원소별 고유 컬러 피드백 */
    .element-btn[data-elem="fire"]:hover, .element-btn[data-elem="fire"].active {
      background: #fef2f2; border-color: #ef4444; color: #dc2626;
    }
    .element-btn[data-elem="water"]:hover, .element-btn[data-elem="water"].active {
      background: #f0f9ff; border-color: #0284c7; color: #0369a1;
    }
    .element-btn[data-elem="wood"]:hover, .element-btn[data-elem="wood"].active {
      background: #f0fdf4; border-color: #16a34a; color: #15803d;
    }
    .element-btn[data-elem="earth"]:hover, .element-btn[data-elem="earth"].active {
      background: #fffbeb; border-color: #d97706; color: #b45309;
    }
    .element-btn[data-elem="wind"]:hover, .element-btn[data-elem="wind"].active {
      background: #f5f3ff; border-color: #8b5cf6; color: #6d28d9;
    }

    .element-btn.active {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    /* 제출 버튼 */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.45);
    }

    /* ==========================================
       운세 결과 연출 카카오/유리 스타일
       ========================================== */
    .result-section {
      display: none;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.5s ease;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.12),
                  0 0 0 1px rgba(255, 255, 255, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .result-user-info {
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      background: #f1f5f9;
      padding: 6px 16px;
      border-radius: 100px;
    }

    .result-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .result-score-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0f172a;
    }

    .luck-stars {
      color: #f59e0b;
      font-size: 1.2rem;
      display: flex;
      gap: 4px;
    }

    .result-text {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #334155;
      word-break: keep-all;
      background: #f8fafc;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      width: 100%;
    }

    .lucky-tips {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .tip-box {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tip-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
    }

    .tip-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1e293b;
    }

    .btn-retry {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 12px 28px;
      border-radius: 100px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-retry:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <div class="header-logo">
      <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='inline';">
        <span id="fallback-logo" class="logo-fallback">NANALAB</span>
      </a>
    </div>
    <div class="site-title">Element Fortune</div>
  </header>

  <!-- 메인 영역 -->
  <main>
    
    <div class="hero-section">
      <h1 class="hero-title">오늘의 원소 운세</h1>
      <p class="hero-sub">당신의 성향과 원소 기운이 만나 오늘 하루를 점쳐줍니다.</p>
    </div>

    <!-- 입력 폼 섹션 -->
    <div class="card-form" id="form-section">
      
      <!-- 이름 입력 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-user" style="color: #6366f1;"></i> 이름 (성함)</label>
        <input type="text" id="user-name" class="form-control" placeholder="이름을 입력해 주세요">
      </div>

      <!-- 생년월일 입력 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-cake-candles" style="color: #ec4899;"></i> 생년월일</label>
        <input type="date" id="user-birth" class="form-control">
      </div>

      <!-- 성별 선택 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-venus-mars" style="color: #8b5cf6;"></i> 성별</label>
        <div class="gender-group">
          <button type="button" class="gender-btn active" data-gender="남성"><i class="fa-solid fa-mars"></i> 남성</button>
          <button type="button" class="gender-btn" data-gender="여성"><i class="fa-solid fa-venus"></i> 여성</button>
        </div>
      </div>

      <!-- 5가지 원소 선택 (불, 물, 나무, 땅, 바람) -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-wand-magic-sparkles" style="color: #f59e0b;"></i> 오늘의 끌리는 원소 선택</label>
        <div class="element-grid">
          <button type="button" class="element-btn active" data-elem="fire">
            <i class="fa-solid fa-fire" style="color: #ef4444;"></i>
            <span>불 (Fire)</span>
          </button>
          <button type="button" class="element-btn" data-elem="water">
            <i class="fa-solid fa-droplet" style="color: #0284c7;"></i>
            <span>물 (Water)</span>
          </button>
          <button type="button" class="element-btn" data-elem="wood">
            <i class="fa-solid fa-tree" style="color: #16a34a;"></i>
            <span>나무 (Wood)</span>
          </button>
          <button type="button" class="element-btn" data-elem="earth">
            <i class="fa-solid fa-mountain" style="color: #d97706;"></i>
            <span>땅 (Earth)</span>
          </button>
          <button type="button" class="element-btn" data-elem="wind">
            <i class="fa-solid fa-wind" style="color: #8b5cf6;"></i>
            <span>바람 (Wind)</span>
          </button>
        </div>
      </div>

      <!-- 운세 보기 버튼 -->
      <button type="button" class="btn-submit" id="btn-submit">
        <i class="fa-solid fa-crystal-ball"></i> 오늘의 운세 확인하기
      </button>

    </div>

    <!-- 운세 결과 출력 섹션 -->
    <div class="result-section" id="result-section">
      <div class="result-card">
        <div class="result-user-info" id="result-user-info">홍길동 님 (1995.05.05 / 남성)</div>
        
        <!-- 원소 아이콘 뱃지 -->
        <div class="result-badge" id="result-badge">🔥</div>
        
        <div class="result-score-title" id="result-score-title">대길(大吉) - 열정이 결실을 맺는 날!</div>
        <div class="luck-stars" id="result-stars">★★★★★</div>
        
        <!-- 상세 운세 텍스트 -->
        <p class="result-text" id="result-text">
          오늘 당신의 운세 풀이가 여기에 표시됩니다.
        </p>

        <!-- 행운 요소 -->
        <div class="lucky-tips">
          <div class="tip-box">
            <span class="tip-label">🍀 행운의 컬러</span>
            <span class="tip-val" id="lucky-color">인디고 블루</span>
          </div>
          <div class="tip-box">
            <span class="tip-label">🔢 행운의 숫자</span>
            <span class="tip-val" id="lucky-number">7</span>
          </div>
        </div>

        <button type="button" class="btn-retry" onclick="resetForm()">
          <i class="fa-solid fa-arrow-rotate-left"></i> 다시 점치기
        </button>
      </div>
    </div>

  </main>

  <script>
    let selectedGender = '남성';
    let selectedElement = 'fire';

    // 마우스 추적 배경 인터랙션
    document.addEventListener('mousemove', (e) => {
      const xPercent = (e.clientX / window.innerWidth) * 100;
      const yPercent = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', `${xPercent}%`);
      document.documentElement.style.setProperty('--mouse-y', `${yPercent}%`);
    });

    // 성별 버튼 클릭
    const genderBtns = document.querySelectorAll('.gender-btn');
    genderBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        genderBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedGender = btn.dataset.gender;
      });
    });

    // 원소 버튼 클릭
    const elemBtns = document.querySelectorAll('.element-btn');
    elemBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        elemBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedElement = btn.dataset.elem;
      });
    });

    // 5가지 원소별 랜덤 운세 데이터베이스
    const fortuneDB = {
      fire: [
        { title: "열정이 타오르는 대길(大吉)의 날!", stars: "★★★★★", text: "불처럼 타오르는 강렬한 에너지와 결단력이 빛을 발하는 날입니다. 그동안 주저했던 일이 있다면 오늘 적극적으로 추진해 보세요. 주위 사람들을 이끄는 리더십이 돋보일 것입니다." },
        { title: "성급함을 조심해야 할 유의의 날", stars: "★★★☆☆", text: "열정이 과하면 의욕이 앞서 실수를 할 수 있습니다. 불의 기운이 강한 날일수록 한 걸음 물러서서 냉정하게 상황을 판단하는 지혜가 필요합니다." },
        { title: "새로운 변화의 불꽃이 피어나는 날", stars: "★★★★☆", text: "답답했던 흐름을 깨고 새로운 아이디어가 솟구칩니다. 직관을 믿고 도전하면 기대 이상의 성과를 얻을 수 있습니다." }
      ],
      water: [
        { title: "유연함과 지혜가 샘솟는 쾌청의 날!", stars: "★★★★★", text: "막힘없이 흐르는 물처럼 모든 일들이 순조롭게 풀어집니다. 대인관계에서 당신의 따뜻한 조언과 포용력이 빛을 발하며, 훌륭한 귀인을 만나게 될 운입니다." },
        { title: "차분한 유지가 필요한 안정의 날", stars: "★★★☆☆", text: "잔잔한 호수처럼 마음을 다스려야 하는 날입니다. 무리한 확장보다는 현재 가지고 있는 것을 정리하고 내실을 다지는 것이 유리합니다." },
        { title: "감성이 풍부해지는 힐링의 날", stars: "★★★★☆", text: "창의력과 예술적 감수성이 배가되는 날입니다. 생각지도 못한 귀중한 힌트를 얻거나 좋은 인연이 찾아옵니다." }
      ],
      wood: [
        { title: "글로벌하게 성장하는 희망의 날!", stars: "★★★★★", text: "울창한 나무가 쑥쑥 자라듯 당신의 노력과 성과가 세상에 드러나는 기분 좋은 날입니다. 준비해 온 프로젝트나 시험, 성과 발표에서 칭찬이 쏟아집니다." },
        { title: "뿌리를 굳건히 내려야 하는 충실의 날", stars: "★★★☆☆", text: "가지가 너무 퍼지면 바람에 흔들리기 마련입니다. 목표를 단순화하고 기본에 충실할 때 최고의 결과를 낼 수 있습니다." },
        { title: "새로운 싹이 움트는 기회의 날", stars: "★★★★☆", text: "새로운 인연이나 프로젝트를 시작하기에 최적의 날입니다. 주변의 도움을 적극적으로 수용해 보세요." }
      ],
      earth: [
        { title: "풍요로운 결실을 맺는 듬직한 날!", stars: "★★★★★", text: "대지처럼 묵묵히 제자리를 지켜온 당신에게 금전적, 정신적 풍요로움이 쏟아지는 날입니다. 믿음직한 태도가 사람들의 마음을 사로잡습니다." },
        { title: "고집을 내려놓아야 하는 평온의 날", stars: "★★★☆☆", text: "땅처럼 견고한 생각도 좋지만, 가끔은 상대방의 의견을 유연하게 수용하는 조화가 필요합니다." },
        { title: "재물운과 차분함이 상승하는 날", stars: "★★★★☆", text: "실속을 챙기기에 더없이 좋은 날입니다. 잊고 있던 이득이나 작은 행운이 굴러들어옵니다." }
      ],
      wind: [
        { title: "자유로운 소통과 활력이 가득한 날!", stars: "★★★★★", text: "산뜻한 바람처럼 사방으로 막힘없이 솔솔 풀리는 날입니다. 신선한 뉴스나 기쁜 소식이 전달되며 방방곡곡 당신의 존재감이 상승합니다." },
        { title: "집중력이 필요한 주의의 날", stars: "★★★☆☆", text: "바람처럼 생각이 이리저리 흩어질 수 있으니 한 가지 주요 목표에 집중하는 노력이 필요합니다." },
        { title: "기분 좋은 바람이 인연을 전해주는 날", stars: "★★★★☆", text: "우연히 만난 이와의 대화에서 큰 깨달음을 얻거나 즐거운 사건이 벌어집니다." }
      ]
    };

    const luckyColors = ["상쾌한 폰드 블루", "따뜻한 코랄 핑크", "신비로운 인디고 violet", "에메랄드 그린", "골든 옐로우", "클래식 화이트"];
    const elementTheme = {
      fire: { icon: "🔥", bg: "#fef2f2", color: "#dc2626" },
      water: { icon: "💧", bg: "#f0f9ff", color: "#0369a1" },
      wood: { icon: "🌿", bg: "#f0fdf4", color: "#15803d" },
      earth: { icon: "⛰️", bg: "#fffbeb", color: "#b45309" },
      wind: { icon: "🌬️", bg: "#f5f3ff", color: "#6d28d9" }
    };

    // 버튼 클릭 이벤트
    document.getElementById('btn-submit').addEventListener('click', () => {
      const name = document.getElementById('user-name').value.trim();
      const birth = document.getElementById('user-birth').value;

      if (!name) {
        alert('성함을 입력해 주세요!');
        return;
      }
      if (!birth) {
        alert('생년월일을 선택해 주세요!');
        return;
      }

      // 운세 결과 추출 (랜덤)
      const list = fortuneDB[selectedElement];
      const resultData = list[Math.floor(Math.random() * list.length)];
      const randomColor = luckyColors[Math.floor(Math.random() * luckyColors.length)];
      const randomNumber = Math.floor(Math.random() * 99) + 1;

      // 화면 업데이트
      document.getElementById('result-user-info').innerText = `${name} 님 (${birth} / ${selectedGender})`;
      
      const theme = elementTheme[selectedElement];
      const badge = document.getElementById('result-badge');
      badge.innerText = theme.icon;
      badge.style.backgroundColor = theme.bg;

      document.getElementById('result-score-title').innerText = resultData.title;
      document.getElementById('result-stars').innerText = resultData.stars;
      document.getElementById('result-text').innerText = resultData.text;
      document.getElementById('lucky-color').innerText = randomColor;
      document.getElementById('lucky-number').innerText = randomNumber;

      // 섹션 전환
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'flex';
    });

    function resetForm() {
      document.getElementById('form-section').style.display = 'flex';
      document.getElementById('result-section').style.display = 'none';
    }
  </script>
</body>
</html>
