<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Merge Studio</title>

  <!-- Pretendard 폰트 & FontAwesome 아이콘 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- pdf-lib 라이브러리 (브라우저 단 순수 JS PDF 병합 엔진) -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1e293b;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(199, 210, 254, 0.75) 0%, rgba(243, 232, 255, 0.45) 30%, rgba(254, 242, 242, 0.1) 60%),
        linear-gradient(135deg, #f0f7ff 0%, #f5f3ff 50%, #fef2f2 100%);
      background-attachment: fixed;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      height: 72px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      z-index: 100;
    }

    .header-logo a {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header-logo img {
      height: 38px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: 800;
      font-size: 1.2rem;
      color: #4f46e5;
      display: none;
    }

    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 메인 콘텐츠 */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .hero-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ef4444 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 0.95rem;
      color: #64748b;
    }

    /* 드래그 앤 드롭 영역 */
    .dropzone {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 2px dashed #fca5a5;
      border-radius: 28px;
      padding: 48px 24px;
      text-align: center;
      box-shadow: 0 20px 40px -10px rgba(239, 68, 68, 0.08),
                  0 0 0 1px rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: #ef4444;
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 0 25px 50px -10px rgba(239, 68, 68, 0.18),
                  0 0 0 2px #ef4444;
    }

    .dropzone-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #fef2f2 0%, #ffe4e6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 1.6rem;
    }

    .dropzone-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .dropzone-sub {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .btn-select {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      padding: 13px 30px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3);
      transition: all 0.2s ease;
    }

    .btn-select:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transform: translateY(-1px);
    }

    #file-input { display: none; }

    /* PDF 파일 순서 관리 목록 카드 */
    .file-list-card {
      display: none;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 15px 35px -5px rgba(239, 68, 68, 0.08),
                  0 0 0 1px rgba(255, 255, 255, 0.9);
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.4s ease;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }

    .list-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-items-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pdf-item {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .pdf-item:hover {
      border-color: #fca5a5;
    }

    .pdf-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .pdf-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #fef2f2;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .pdf-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .pdf-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-size {
      font-size: 0.78rem;
      color: #64748b;
    }

    /* 항목 컨트롤 버튼 */
    .pdf-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s ease;
    }

    .ctrl-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .ctrl-btn.del:hover {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* 하단 병합 실행 버튼 */
    .btn-merge {
      width: 100%;
      padding: 16px;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-merge:hover {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(239, 68, 68, 0.45);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <div class="header-logo">
      <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='inline';">
        <span id="fallback-logo" class="logo-fallback">NANALAB</span>
      </a>
    </div>
    <div class="site-title">PDF Merge Studio</div>
  </header>

  <!-- 메인 영역 -->
  <main>
    
    <div class="hero-section">
      <h1 class="hero-title">PDF 문서 병합기</h1>
      <p class="hero-sub">여러 개의 PDF 파일들을 단 하나의 PDF 문서로 손쉽게 결합하세요.</p>
    </div>

    <!-- 업로드 영역 -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">
        <i class="fa-solid fa-file-pdf"></i>
      </div>
      <div class="dropzone-title">Upload or Drop PDF files</div>
      <div class="dropzone-sub">병합할 여러 개의 PDF 파일들을 선택하거나 올려주세요</div>
      <button type="button" class="btn-select" onclick="document.getElementById('file-input').click();">
        <i class="fa-solid fa-folder-open"></i> PDF 파일들 선택하기
      </button>
      <input type="file" id="file-input" multiple accept="application/pdf">
    </div>

    <!-- 업로드된 PDF 파일 목록 카테고리 -->
    <div class="file-list-card" id="file-list-card">
      <div class="list-header">
        <div class="list-title">
          <i class="fa-solid fa-list-check" style="color: #ef4444;"></i> 병합할 PDF 목록 (<span id="pdf-count">0</span>개)
        </div>
        <button type="button" class="btn-select" style="padding: 6px 16px; font-size: 0.82rem;" onclick="document.getElementById('file-input').click();">
          <i class="fa-solid fa-plus"></i> 파일 추가
        </button>
      </div>

      <!-- 동적 PDF 아이템 헤더 -->
      <div class="pdf-items-container" id="pdf-items-container"></div>

      <!-- 병합 및 다운로드 버튼 -->
      <button type="button" class="btn-merge" id="btn-merge" onclick="mergePdfs()">
        <i class="fa-solid fa-object-group"></i> Merge PDFs & Download
      </button>
    </div>

  </main>

  <script>
    let pdfFiles = [];

    // 마우스 추적 파스텔 배경 인터랙션
    document.addEventListener('mousemove', (e) => {
      const xPercent = (e.clientX / window.innerWidth) * 100;
      const yPercent = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', `${xPercent}%`);
      document.documentElement.style.setProperty('--mouse-y', `${yPercent}%`);
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileListCard = document.getElementById('file-list-card');
    const pdfItemsContainer = document.getElementById('pdf-items-container');
    const pdfCount = document.getElementById('pdf-count');
    const btnMerge = document.getElementById('btn-merge');

    // 드래그 앤 드롭 이벤트
    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFiles(e.target.files);
        fileInput.value = '';
      }
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function handleFiles(files) {
      const validPdfs = Array.from(files).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
      if (validPdfs.length === 0) {
        alert('PDF 파일만 선택이 가능합니다.');
        return;
      }

      pdfFiles = [...pdfFiles, ...validPdfs];
      renderPdfList();
    }

    // PDF 목록 렌더링
    function renderPdfList() {
      pdfCount.innerText = pdfFiles.length;

      if (pdfFiles.length === 0) {
        fileListCard.style.display = 'none';
        return;
      }

      fileListCard.style.display = 'flex';
      pdfItemsContainer.innerHTML = '';

      pdfFiles.forEach((file, index) => {
        const itemHTML = `
          <div class="pdf-item">
            <div class="pdf-item-left">
              <div class="pdf-badge"><i class="fa-solid fa-file-pdf"></i></div>
              <div class="pdf-details">
                <div class="pdf-name">${file.name}</div>
                <div class="pdf-size">${formatBytes(file.size)}</div>
              </div>
            </div>
            <div class="pdf-controls">
              <button class="ctrl-btn" onclick="movePdf(${index}, -1)" title="위로 이동" ${index === 0 ? 'disabled style="opacity:0.3;"' : ''}>
                <i class="fa-solid fa-arrow-up"></i>
              </button>
              <button class="ctrl-btn" onclick="movePdf(${index}, 1)" title="아래로 이동" ${index === pdfFiles.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>
                <i class="fa-solid fa-arrow-down"></i>
              </button>
              <button class="ctrl-btn del" onclick="removePdf(${index})" title="삭제">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
        `;
        pdfItemsContainer.insertAdjacentHTML('beforeend', itemHTML);
      });
    }

    // 파일 순서 변경
    function movePdf(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= pdfFiles.length) return;
      
      const temp = pdfFiles[index];
      pdfFiles[index] = pdfFiles[newIndex];
      pdfFiles[newIndex] = temp;
      renderPdfList();
    }

    // 파일 삭제
    function removePdf(index) {
      pdfFiles.splice(index, 1);
      renderPdfList();
    }

    // pdf-lib 기반 PDF 병합 실행
    async function mergePdfs() {
      if (pdfFiles.length < 2) {
        alert('병합을 하려면 최소 2개 이상의 PDF 파일이 필요합니다.');
        return;
      }

      btnMerge.innerHTML = `<i class="fa-solid fa-gear fa-spin"></i> Merging PDFs...`;
      btnMerge.disabled = true;

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of pdfFiles) {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
          const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        
        // 다운로드 실행
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `merged_document_${Date.now()}.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

      } catch (err) {
        console.error("PDF Merge Error:", err);
        alert('PDF 파일을 병합하는 도중 오류가 발생했습니다.');
      } finally {
        btnMerge.innerHTML = `<i class="fa-solid fa-object-group"></i> Merge PDFs & Download`;
        btnMerge.disabled = false;
      }
    }
  </script>
</body>
</html>
