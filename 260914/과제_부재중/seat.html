<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Away Screen</title>

  <!-- Pretendard 폰트 & FontAwesome 아이콘 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --mouse-x: 50%;
      --mouse-y: 50%;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1e293b;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(199, 210, 254, 0.75) 0%, rgba(243, 232, 255, 0.45) 30%, rgba(254, 242, 242, 0.1) 60%),
        linear-gradient(135deg, #f0f7ff 0%, #f5f3ff 50%, #fef2f2 100%);
      background-attachment: fixed;
    }

    /* 상단 헤더 */
    header {
      width: 100%;
      height: 72px;
      padding: 0 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      z-index: 100;
    }

    .header-logo a {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header-logo img {
      height: 38px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: 800;
      font-size: 1.2rem;
      color: #4f46e5;
      display: none;
    }

    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 메인 설정 폼 영역 */
    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .hero-section {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 0.95rem;
      color: #64748b;
    }

    /* 입력 폼 카드 */
    .card-form {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.08),
                  0 0 0 1px rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 100px;
      border: none;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(79, 70, 229, 0.45);
    }

    /* ==========================================
       부재중 디스플레이 화면 (전체 화면 연출)
       ========================================== */
    #away-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #ffffff;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .away-header-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 100px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .away-center-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }

    /* 가장 큰 글자: 일정 명 */
    .away-schedule-title {
      font-size: clamp(3.2rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-shadow: 0 10px 30px rgba(0,0,0,0.2);
      word-break: keep-all;
    }

    /* 복귀 예정 시간 및 카운트다운 박스 */
    .away-timer-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }

    .time-info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-lbl {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.85;
      text-transform: uppercase;
    }

    .time-val {
      font-size: 2.2rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .time-divider {
      width: 1px;
      height: 40px;
      background: rgba(255, 255, 255, 0.4);
    }

    /* 기타 안내 문구 */
    .away-notice-text {
      font-size: 1.35rem;
      font-weight: 600;
      opacity: 0.95;
      max-width: 720px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      padding: 14px 28px;
      border-radius: 100px;
      word-break: keep-all;
    }

    .away-footer-hint {
      font-size: 0.9rem;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header>
    <div class="header-logo">
      <a href="https://nanalab.kr" target="_blank" rel="noopener noreferrer">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='inline';">
        <span id="fallback-logo" class="logo-fallback">NANALAB</span>
      </a>
    </div>
    <div class="site-title">Smart Away Screen</div>
  </header>

  <!-- 메인 입력 폼 영역 -->
  <main id="main-form-container">
    
    <div class="hero-section">
      <h1 class="hero-title">부재중 화면 설정</h1>
      <p class="hero-sub">자리를 비울 때 화면에 표시할 일정과 복귀 시간을 세팅하세요.</p>
    </div>

    <div class="card-form">
      
      <!-- 1. 일정 입력 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-calendar-check" style="color: #6366f1;"></i> 현재 일정 / 부재 사유 (가장 크게 표시)</label>
        <input type="text" id="input-schedule" class="form-control" placeholder="예: 외부 미팅 중, 점심 식사, 팀 회의" value="외부 미팅 중">
      </div>

      <!-- 2. 돌아오는 시간 입력 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-clock" style="color: #ec4899;"></i> 복귀 예정 시간</label>
        <input type="time" id="input-time" class="form-control">
      </div>

      <!-- 3. 기타 안내 문구 입력 -->
      <div class="form-group">
        <label class="form-label"><i class="fa-solid fa-comment-dots" style="color: #8b5cf6;"></i> 기타 안내 문구</label>
        <textarea id="input-notice" class="form-control" rows="3" placeholder="예: 급한 건은 핸드폰(010-XXXX-XXXX)으로 연락 부탁드립니다.">급한 건은 핸드폰으로 연락 부탁드립니다.</textarea>
      </div>

      <button type="button" class="btn-submit" onclick="startAwayScreen()">
        <i class="fa-solid fa-display"></i> 부재중 화면 시작하기
      </button>

    </div>

  </main>

  <!-- 부재중 화면 전체 디스플레이 -->
  <div id="away-screen" onclick="exitAwayScreen()">
    
    <!-- 상단 뱃지 -->
    <div class="away-header-tag">
      <i class="fa-solid fa-user-clock"></i> CURRENTLY AWAY
    </div>

    <!-- 중앙 메인 정보 -->
    <div class="away-center-box">
      <!-- 일정 (제일 큰 글자) -->
      <h1 class="away-schedule-title" id="display-schedule">외부 미팅 중</h1>

      <!-- 복귀 시간 & 카운트다운 타이머 -->
      <div class="away-timer-card">
        <div class="time-info-item">
          <span class="time-lbl">복귀 예정</span>
          <span class="time-val" id="display-return-time">15:00</span>
        </div>
        <div class="time-divider"></div>
        <div class="time-info-item">
          <span class="time-lbl">남은 시간</span>
          <span class="time-val" id="display-countdown">00:00:00</span>
        </div>
      </div>

      <!-- 기타 안내 문구 -->
      <p class="away-notice-text" id="display-notice">
        급한 건은 핸드폰으로 연락 부탁드립니다.
      </p>
    </div>

    <!-- 하단 이스케이프 힌트 -->
    <div class="away-footer-hint">
      <i class="fa-solid fa-arrow-pointer"></i> 화면을 클릭하면 설정으로 돌아갑니다.
    </div>

  </div>

  <script>
    let timerInterval = null;

    // 마우스 추적 파스텔 그라데이션 인터랙션
    document.addEventListener('mousemove', (e) => {
      const xPercent = (e.clientX / window.innerWidth) * 100;
      const yPercent = (e.clientY / window.innerHeight) * 100;
      document.documentElement.style.setProperty('--mouse-x', `${xPercent}%`);
      document.documentElement.style.setProperty('--mouse-y', `${yPercent}%`);
    });

    // 기본 복귀 시간 설정 (현재 시간 + 1시간)
    const timeInput = document.getElementById('input-time');
    const now = new Date();
    now.setHours(now.getHours() + 1);
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    timeInput.value = `${hours}:${minutes}`;

    // 부재중 화면 실행
    function startAwayScreen() {
      const schedule = document.getElementById('input-schedule').value.trim() || "잠시 자리를 비웠습니다";
      const returnTimeVal = document.getElementById('input-time').value;
      const notice = document.getElementById('input-notice').value.trim();

      document.getElementById('display-schedule').innerText = schedule;
      document.getElementById('display-return-time').innerText = returnTimeVal || "--:--";
      document.getElementById('display-notice').innerText = notice;

      // 화면 전환
      document.getElementById('away-screen').style.display = 'flex';

      // 전체 화면 모드 시도
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      // 실시간 카운트다운 시작
      startCountdown(returnTimeVal);
    }

    // 복귀 시간 카운트다운 타이머
    function startCountdown(timeStr) {
      if (timerInterval) clearInterval(timerInterval);

      if (!timeStr) {
        document.getElementById('display-countdown').innerText = "--:--:--";
        return;
      }

      const [targetH, targetM] = timeStr.split(':').map(Number);

      function updateTimer() {
        const currentDate = new Date();
        const targetDate = new Date();
        targetDate.setHours(targetH, targetM, 0, 0);

        // 복귀 시간이 이미 지났다면 내일 같은 시간으로 설정
        if (targetDate < currentDate) {
          targetDate.setDate(targetDate.getDate() + 1);
        }

        const diffMs = targetDate - currentDate;

        if (diffMs <= 0) {
          document.getElementById('display-countdown').innerText = "복귀 예정 시간 도착";
          return;
        }

        const diffSec = Math.floor(diffMs / 1000);
        const h = String(Math.floor(diffSec / 3600)).padStart(2, '0');
        const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
        const s = String(diffSec % 60).padStart(2, '0');

        document.getElementById('display-countdown').innerText = `${h}:${m}:${s}`;
      }

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    // 부재중 화면 종료
    function exitAwayScreen() {
      document.getElementById('away-screen').style.display = 'none';
      if (timerInterval) clearInterval(timerInterval);

      if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    // ESC 키로도 종료 가능하도록 지원
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') exitAwayScreen();
    });
  </script>
</body>
</html>
